services:
  mysql:
    image: mysql:8.0
    container_name: yugioh-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kali62
      MYSQL_DATABASE: yugioh_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - yugioh_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: yugioh-backend
    restart: always
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: kali62
      DB_NAME: yugioh_db
      DB_PORT: 3306
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - yugioh_network
    depends_on:
      mysql:
        condition: service_healthy
    command: npm start

  frontend:
    build:
      context: ./frontend
    container_name: yugioh-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - yugioh_network
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

networks:
  yugioh_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
